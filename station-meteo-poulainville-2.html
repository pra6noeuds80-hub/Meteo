<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Station météo – Poulainville</title>
<style>
:root{--bg:#eef3f7;--card:rgba(255,255,255,.84);--tx:#1d2b36;--mu:#6b7c89;--ac:#2f6fa3;--rain:#3b82c4;--gel:#6cc3e6;--sun:#f2b632;--bd:#d7e0e7}
@media(prefers-color-scheme:dark){:root{--bg:#10181f;--card:rgba(24,35,44,.84);--tx:#e6eef4;--mu:#8fa2b0;--ac:#6fb0e3;--bd:#2a3a46}}
*{box-sizing:border-box}
#bg{position:fixed;inset:0;z-index:-1;background:center/cover no-repeat;opacity:.7;transition:background-image .6s}
.card{backdrop-filter:blur(3px)}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:12px;max-width:760px;margin-inline:auto}
h1{font-size:1.25rem;margin:4px 0 2px}.sub{color:var(--mu);font-size:.85rem;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
#veille{position:relative;overflow:hidden;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
#veille .big{font-size:2.6rem}.v b{font-size:1.3rem}.v div{color:var(--mu);font-size:.9rem}
.drop{position:absolute;top:-20px;width:2px;height:14px;background:var(--rain);opacity:.5;border-radius:2px;animation:fall 1.2s linear infinite}
@keyframes fall{to{transform:translateY(160px)}}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.nav b{text-transform:capitalize;font-size:1.05rem}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:7px 12px;font-size:.9rem;cursor:pointer}
button:disabled{opacity:.35}button.s{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:.7rem;color:var(--mu)}
.c{min-height:62px;border:1px solid var(--bd);border-radius:8px;padding:3px;font-size:.68rem;cursor:pointer;line-height:1.25;overflow:hidden}
.c.e{border:0;cursor:default}.c .n{font-weight:600;font-size:.75rem}
.c.pluie{background:rgba(59,130,196,.18)}.c.gel{box-shadow:inset 0 0 0 2px var(--gel)}.c.beau{background:rgba(242,182,50,.2)}
.c.auj{outline:2px solid var(--ac)}.c .t{color:var(--mu)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;font-size:.85rem}
.stats div{background:var(--bg);border-radius:8px;padding:8px}.stats b{display:block;font-size:1.05rem}
.leg{font-size:.75rem;color:var(--mu);margin-top:8px}
#st{font-size:.8rem;color:var(--mu);margin:6px 0}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx)}
dialog label{display:block;margin:8px 0;font-size:.85rem}dialog input{width:100%;padding:6px;margin-top:3px}
.row{display:flex;gap:8px;flex-wrap:wrap}
select,#q{padding:7px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:.9rem}#q{flex:1;min-width:140px}
</style></head><body><div id="bg"></div>
<h1>🌦️ Station météo de France</h1>
<div class="sub">Poulainville par défaut · toute commune de France · 12 mois en mémoire par lieu · données Open-Meteo</div>
<div class="card row" style="align-items:center">
 <select id="lieu"></select><button class="s" id="rm">Retirer</button>
 <input id="q" placeholder="Autre commune de France…"><button id="go">Chercher</button>
 <div id="res" class="row" style="width:100%"></div>
</div>

<div class="card" id="veille"></div>

<div class="card">
 <div class="nav"><button id="pr">◀</button><b id="mois"></b><button id="nx">▶</button></div>
 <div class="grid" id="dows"></div><div class="grid" id="cal"></div>
 <div class="leg">🌧 pluie (mm) · ❄ gel (min ≤ 0 °C) · ☀ beau temps (ensoleillé, sans pluie) · touchez un jour pour corriger</div>
</div>

<div class="card"><b>Bilan du mois</b><div class="stats" id="stats" style="margin-top:8px"></div></div>

<div class="row">
 <button id="maj">↻ Mettre à jour</button>
 <button class="s" id="exp">Exporter</button>
 <button class="s" id="imp">Importer</button>
 <input type="file" id="file" accept=".json" hidden>
</div>
<div id="st"></div>

<dialog id="dlg"><form method="dialog">
 <b id="dt"></b>
 <label>Température maxi (°C)<input id="fx" type="number" step="0.1"></label>
 <label>Température mini (°C)<input id="fn" type="number" step="0.1"></label>
 <label>Pluie (mm)<input id="fr" type="number" step="0.1" min="0"></label>
 <label>Soleil (heures)<input id="fs" type="number" step="0.1" min="0"></label>
 <div class="row"><button value="ok" id="ok">Enregistrer</button><button class="s" value="x">Annuler</button></div>
</form></dialog>

// 0 nuit/orage · 1 aube · 2 automne · 3 neige · 4 nature · 5 mer/cascade · 6 feu · 7 vent · 8 ville/forêt
function setBg(d){
  let i=4;
  if(d){
    if(d.tmin!=null&&d.tmin<=0)i=3;
    else if(d.rain!=null&&d.rain>=8)i=0;
    else if(d.rain!=null&&d.rain>=0.2)i=5;
    else if(d.tmax!=null&&d.tmax>=27)i=6;
    else if(d.sun!=null&&d.sun>=6)i=1;
    else if(d.tmax!=null&&d.tmax<12)i=2;
    else i=7;
  }
  $('bg').style.backgroundImage='url('+TILES[i]+')';
}
const BASE=[['Poulainville',49.96,2.32],['Amiens',49.894,2.296],['Lille',50.629,3.057],['Paris',48.857,2.352],['Rouen',49.443,1.099],['Strasbourg',48.573,7.752],['Lyon',45.764,4.836],['Marseille',43.296,5.37],['Nice',43.71,7.262],['Toulouse',43.605,1.444],['Bordeaux',44.838,-0.579],['Nantes',47.218,-1.554],['Rennes',48.117,-1.678],['Brest',48.39,-4.486],['Montpellier',43.611,3.877],['Clermont-Ferrand',45.777,3.087],['Dijon',47.322,5.041],['Ajaccio',41.919,8.739]].map(a=>({n:a[0],la:a[1],lo:a[2]}));
let places;try{places=JSON.parse(localStorage.getItem('meteo_lieux')||'null')}catch(e){}
if(!Array.isArray(places)||!places.length)places=BASE;
if(places[0].n!=='Poulainville')places=[BASE[0],...places.filter(p=>p.n!=='Poulainville')];
let LAT,LON,KEY,PI=0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const savePlaces=()=>{try{localStorage.setItem('meteo_lieux',JSON.stringify(places))}catch(e){}};
const $=id=>document.getElementById(id);
const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
let data={};
function loadData(){data={};try{data=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}}
const today=new Date();today.setHours(12);
const veille=new Date(today);veille.setDate(veille.getDate()-1);
let vy=today.getFullYear(),vm=today.getMonth();

function save(){
  const lim=new Date(today);lim.setDate(lim.getDate()-366);const l=fmt(lim);
  for(const k in data)if(k<l)delete data[k];
  try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}
}
const isGel=d=>d&&d.tmin!=null&&d.tmin<=0;
const isPluie=d=>d&&d.rain!=null&&d.rain>=0.2;
const isBeau=d=>d&&d.rain!=null&&d.rain<0.2&&d.sun!=null&&d.sun>=6;

function renderVeille(){
  const d=data[fmt(veille)],el=$('veille');setBg(d);
  el.innerHTML='';
  if(!d){el.innerHTML='<div class="v"><b>Hier : pas encore de données</b><div>Touchez « Mettre à jour » (connexion requise).</div></div>';return}
  const p=isPluie(d);
  if(p)for(let i=0;i<30;i++){const s=document.createElement('span');s.className='drop';
    s.style.left=Math.random()*100+'%';s.style.animationDelay=(Math.random()*1.2)+'s';
    s.style.animationDuration=(0.7+Math.random()*0.8)+'s';el.appendChild(s)}
  const ic=p?'🌧️':isGel(d)?'❄️':isBeau(d)?'☀️':'⛅';
  el.insertAdjacentHTML('beforeend',`<div class="big">${ic}</div><div class="v"><b>Hier · ${esc(places[PI].n)} : ${p?d.rain.toFixed(1)+' mm de pluie':'pas de pluie'}</b>
  <div>${veille.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</div>
  <div>Mini ${d.tmin??'–'} °C · Maxi ${d.tmax??'–'} °C${isGel(d)?' · gel ❄':''}</div></div>`);
}

function renderCal(){
  $('mois').textContent=MOIS[vm]+' '+vy;
  const first=new Date(vy,vm,1),n=new Date(vy,vm+1,0).getDate(),off=(first.getDay()+6)%7;
  let h='';for(let i=0;i<off;i++)h+='<div class="c e"></div>';
  let st={rain:0,jp:0,gel:0,beau:0,sx:0,nx:0,sn:0,nn:0,mx:null,mn:null};
  for(let j=1;j<=n;j++){
    const k=vy+'-'+String(vm+1).padStart(2,'0')+'-'+String(j).padStart(2,'0'),d=data[k];
    let cl='c',body='';
    if(k===fmt(today))cl+=' auj';
    if(d){
      if(isPluie(d)){cl+=' pluie';body+=`🌧${d.rain.toFixed(1)}<br>`;st.jp++}
      if(d.rain)st.rain+=d.rain;
      if(isGel(d)){cl+=' gel';body+='❄ ';st.gel++}
      if(isBeau(d)){cl+=' beau';body+='☀';st.beau++}
      if(d.tmax!=null){body+=`<div class="t">${Math.round(d.tmax)}° / ${d.tmin!=null?Math.round(d.tmin):'–'}°</div>`;st.sx+=d.tmax;st.nx++;st.mx=Math.max(st.mx??-99,d.tmax)}
      if(d.tmin!=null){st.sn+=d.tmin;st.nn++;st.mn=Math.min(st.mn??99,d.tmin)}
    }
    h+=`<div class="${cl}" data-k="${k}"><span class="n">${j}</span> ${body}</div>`;
  }
  $('cal').innerHTML=h;
  $('stats').innerHTML=`<div>Pluie totale<b>${st.rain.toFixed(1)} mm</b></div><div>Jours de pluie<b>${st.jp}</b></div>
   <div>Jours de gel<b>${st.gel}</b></div><div>Beaux jours<b>${st.beau}</b></div>
   <div>Maxi moyen<b>${st.nx?(st.sx/st.nx).toFixed(1)+' °C':'–'}</b></div><div>Mini moyen<b>${st.nn?(st.sn/st.nn).toFixed(1)+' °C':'–'}</b></div>
   <div>Record chaud<b>${st.mx!=null?st.mx.toFixed(1)+' °C':'–'}</b></div><div>Record froid<b>${st.mn!=null?st.mn.toFixed(1)+' °C':'–'}</b></div>`;
  const a=new Date(today.getFullYear(),today.getMonth()-11,1);
  $('pr').disabled=(vy*12+vm)<=(a.getFullYear()*12+a.getMonth());
  $('nx').disabled=(vy*12+vm)>=(today.getFullYear()*12+today.getMonth());
}
$('dows').innerHTML=['L','M','M','J','V','S','D'].map(x=>`<div class="dow">${x}</div>`).join('');
$('pr').onclick=()=>{vm--;if(vm<0){vm=11;vy--}renderCal()};
$('nx').onclick=()=>{vm++;if(vm>11){vm=0;vy++}renderCal()};

let cur=null;
$('cal').onclick=e=>{
  const c=e.target.closest('.c[data-k]');if(!c)return;cur=c.dataset.k;const d=data[cur]||{};
  $('dt').textContent=new Date(cur+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  $('fx').value=d.tmax??'';$('fn').value=d.tmin??'';$('fr').value=d.rain??'';$('fs').value=d.sun??'';
  $('dlg').showModal();
};
$('ok').onclick=()=>{
  const v=id=>$(id).value===''?null:parseFloat($(id).value);
  data[cur]={tmax:v('fx'),tmin:v('fn'),rain:v('fr'),sun:v('fs'),manual:true};
  save();renderCal();renderVeille();
};

async function maj(){
  $('st').textContent='Mise à jour en cours…';
  const s=new Date(today);s.setDate(s.getDate()-365);
  const p='&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,sunshine_duration&timezone=Europe%2FParis';
  const urls=[`https://archive-api.open-meteo.com/v1/archive?latitude=${LAT}&longitude=${LON}&start_date=${fmt(s)}&end_date=${fmt(veille)}${p}`,
   `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&past_days=7&forecast_days=1${p}`];
  let ok=0;const my=KEY;
  for(const u of urls){
    try{
      const r=await fetch(u);if(!r.ok)continue;const j=(await r.json()).daily;if(!j)continue;
      j.time.forEach((k,i)=>{
        if(my!==KEY||k>fmt(veille)||(data[k]&&data[k].manual))return;
        if(j.temperature_2m_max[i]==null&&j.precipitation_sum[i]==null)return;
        data[k]={tmax:j.temperature_2m_max[i],tmin:j.temperature_2m_min[i],rain:j.precipitation_sum[i],
          sun:j.sunshine_duration[i]!=null?Math.round(j.sunshine_duration[i]/360)/10:null};
        ok++;
      });
    }catch(e){}
  }
  save();renderCal();renderVeille();
  $('st').textContent=ok?`Données à jour (${ok} jours) – ${new Date().toLocaleTimeString('fr-FR')}`:
    'Pas de connexion aux données : vous pouvez saisir les jours à la main.';
}
$('maj').onclick=maj;
$('exp').onclick=()=>{const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));
  a.download='meteo-'+places[PI].n.replace(/\W+/g,'-')+'-'+fmt(today)+'.json';a.click()};
$('imp').onclick=()=>$('file').click();
$('file').onchange=async e=>{try{Object.assign(data,JSON.parse(await e.target.files[0].text()));save();renderCal();renderVeille();$('st').textContent='Import réussi.'}catch(x){$('st').textContent='Fichier invalide.'}};

function buildSel(){$('lieu').innerHTML=places.map((p,i)=>`<option value="${i}">${esc(p.n)}</option>`).join('')}
function setPlace(i){
  PI=i;const p=places[i];LAT=p.la;LON=p.lo;
  KEY=p.n==='Poulainville'?'meteo_poulainville_v1':'meteo_v1_'+p.n+'_'+p.la;
  try{localStorage.setItem('meteo_lieu',String(i))}catch(e){}
  $('lieu').value=i;$('rm').style.display=i?'':'none';
  loadData();vy=today.getFullYear();vm=today.getMonth();
  renderVeille();renderCal();maj();
}
$('lieu').onchange=e=>setPlace(+e.target.value);
$('rm').onclick=()=>{
  if(!PI||!confirm('Retirer '+places[PI].n+' de la liste ? (ses données restent enregistrées)'))return;
  places.splice(PI,1);savePlaces();buildSel();setPlace(0);
};
async function cherche(){
  const q=$('q').value.trim();if(!q)return;$('res').textContent='Recherche…';
  try{
    const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=8&language=fr&countryCode=FR');
    const L=(await r.json()).results||[];$('res').innerHTML='';
    if(!L.length){$('res').textContent='Aucune commune trouvée.';return}
    L.forEach(x=>{
      const b=document.createElement('button');b.className='s';
      const nom=x.name+(x.admin2?' ('+x.admin2+')':'');b.textContent=nom;
      b.onclick=()=>{
        let k=places.findIndex(p=>p.n===nom);
        if(k<0){places.push({n:nom,la:x.latitude,lo:x.longitude});k=places.length-1;savePlaces();buildSel()}
        $('res').innerHTML='';$('q').value='';setPlace(k);
      };
      $('res').appendChild(b);
    });
  }catch(e){$('res').textContent='Recherche impossible hors connexion.'}
}
$('go').onclick=cherche;
$('q').onkeydown=e=>{if(e.key==='Enter')cherche()};
buildSel();
const i0=parseInt(localStorage.getItem('meteo_lieu'));
setPlace(i0>=0&&i0<places.length?i0:0);
</script></body></html>
